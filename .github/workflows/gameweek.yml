name: Gameweek

# Recommendation only. This workflow reads the public FPL API and publishes a
# report; it holds no credentials and cannot modify a team.
on:
  schedule:
    # Tuesday 09:00 UTC — after FPL settles the previous gameweek.
    - cron: "0 9 * * 2"
    # Friday 11:00 UTC — before the usual Friday 17:30 UTC deadline.
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      horizon:
        description: Planning horizon in gameweeks
        default: "3"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Deadline
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
          FPL_TIMEZONE: ${{ vars.FPL_TIMEZONE }}
        run: fpl deadline

      - name: Plan
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
          FPL_TIMEZONE: ${{ vars.FPL_TIMEZONE }}
          FPL_HORIZON: ${{ github.event.inputs.horizon || '3' }}
        run: fpl plan | tee plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gameweek-plan
          path: plan.txt
